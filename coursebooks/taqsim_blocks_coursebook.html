<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaqSim block by block</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#0b0b0b;background:white}body{display:flex;flex-direction:column}.lang-switcher{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#f9f9f7;border-bottom:1px solid #d9d9d1;font-size:.9rem;color:#52514e}.lang-switcher span{margin-right:6px}.lang-switcher button{padding:5px 12px;background:#fcfcfb;border:1px solid #c3c2b7;border-radius:6px;color:#0b0b0b;font:inherit;cursor:pointer}.lang-switcher button[aria-pressed=true]{background:#2a78d6;border-color:#2a78d6;color:white}.lang-switcher button:focus-visible,a:focus-visible{outline:2px solid #2a78d6;outline-offset:2px}.course-link{margin-left:auto;color:#2366a6}#coursebook-frame{border:0;width:100%;flex:1;min-height:0}noscript{padding:20px}@media(max-width:520px){.lang-switcher{gap:5px;padding:7px}.lang-switcher span{width:100%;font-size:.8rem}.lang-switcher button{padding:5px 9px}.course-link{font-size:.8rem}}
</style>
</head>
<body>
<div class="lang-switcher" role="group" aria-label="Language">
<span>Language · Til · Язык:</span>
<button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
<button type="button" data-lang="uz" lang="uz" aria-pressed="false">Oʻzbekcha</button>
<button type="button" data-lang="ru" lang="ru" aria-pressed="false">Русский</button>
<a class="course-link" href="../index.html" id="course-link">Course</a>
</div>
<iframe id="coursebook-frame" title="Coursebook — English"></iframe>
<noscript><a href="taqsim_blocks_coursebook_en.html">English</a> · <a href="taqsim_blocks_coursebook_ru.html">Русский</a> · <a href="taqsim_blocks_coursebook_uz.html">Oʻzbekcha</a></noscript>
<script>
(()=>{'use strict';
const base='taqsim_blocks_coursebook', frame=document.getElementById('coursebook-frame'), buttons=[...document.querySelectorAll('[data-lang]')];
const names={en:'English',ru:'Русский',uz:'Oʻzbekcha'},courseNames={en:'Course',ru:'Курс',uz:'Kurs'},anchors={en:'english',ru:'russian',uz:'uzbek'};
let current='en';
function choose(value){return Object.hasOwn(names,value)?value:'en'}
function bookmark(){try{const doc=frame.contentDocument;const headings=[...doc.querySelectorAll('section[id],h1[id],h2[id],h3[id]')];let nearest=null;for(const h of headings){if(h.getBoundingClientRect().top<=130)nearest=h}return nearest?'#'+encodeURIComponent(nearest.id):frame.contentWindow.location.hash}catch{return location.hash}}
function apply(lang,hash,push){lang=choose(lang);current=lang;document.documentElement.lang=lang;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));frame.title='Coursebook — '+names[lang];const link=document.getElementById('course-link');link.textContent=courseNames[lang];link.href='../index.html#'+anchors[lang];const target=base+'_'+lang+'.html'+hash;if(frame.hasAttribute('src'))frame.contentWindow.location.replace(target);else frame.src=target;const url=new URL(location.href);url.searchParams.set('lang',lang);url.hash=hash;if(push)history.pushState(null,'',url);else history.replaceState(null,'',url);try{localStorage.setItem('taqsim-coursebook-language',lang)}catch{}}
buttons.forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang!==current)apply(b.dataset.lang,bookmark(),true)}));
frame.addEventListener('load',()=>{try{const w=frame.contentWindow;document.title=frame.contentDocument.title;for(const a of frame.contentDocument.querySelectorAll('a[href]')){const href=a.getAttribute('href');if(!href||href.startsWith('#')||href.startsWith('javascript:'))continue;const url=new URL(a.href);if(url.pathname!==w.location.pathname||url.origin!==location.origin){a.target=url.origin===location.origin?'_top':'_blank';a.rel='noopener'}}w.addEventListener('hashchange',()=>{const url=new URL(location.href);url.hash=w.location.hash;history.replaceState(null,'',url)})}catch{}});
window.addEventListener('popstate',()=>apply(new URLSearchParams(location.search).get('lang'),location.hash,false));
let saved='en';try{saved=localStorage.getItem('taqsim-coursebook-language')||'en'}catch{}
apply(new URLSearchParams(location.search).get('lang')||saved,location.hash,false);
})();
</script>
</body>
</html>
