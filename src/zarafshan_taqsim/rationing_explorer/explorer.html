<div class="viz-root" id="rationing-explorer">
  <div class="rx-controls">
    <label class="rx-slider" for="rx-trigger">
      <span><span data-rx="trigger-before">Trigger: start rationing when the reservoir holds less than </span><strong id="rx-trigger-out"></strong><span data-rx="trigger-after"></span></span>
      <input type="range" id="rx-trigger" min="0" step="1" />
    </label>
    <label class="rx-slider" for="rx-ration">
      <span><span data-rx="ration-before">Ration: then deliver </span><strong id="rx-ration-out"></strong><span data-rx="ration-after"> of the summer need</span></span>
      <input type="range" id="rx-ration" min="0" step="1" />
    </label>
    <div class="rx-presets" role="group" aria-label="Example plans">
      <button type="button" data-trigger="0" data-ration="1" data-rx="preset-none">No rationing</button>
      <button type="button" data-trigger="16" data-ration="0.8" data-rx="preset-light">Ration lightly</button>
      <button type="button" data-trigger="16" data-ration="0.5" data-rx="preset-deep">Cut deep</button>
    </div>
  </div>

  <div class="rx-tiles">
    <div class="rx-tile">
      <div class="rx-tile-label" data-rx="tile-mean">Average shortage</div>
      <div class="rx-tile-value"><span id="rx-mean"></span><small data-rx="tile-mean-unit"> Mm³ per year not delivered</small></div>
      <div class="rx-tile-note" id="rx-mean-note"></div>
    </div>
    <div class="rx-tile">
      <div class="rx-tile-label" data-rx="tile-worst">Worst month</div>
      <div class="rx-tile-value"><span id="rx-worst"></span><small data-rx="tile-worst-unit"> % of need not delivered</small></div>
      <div class="rx-tile-note" id="rx-worst-note"></div>
    </div>
    <div class="rx-tile">
      <div class="rx-tile-label" data-rx="tile-years">Years short</div>
      <div class="rx-tile-value"><span id="rx-years"></span><small data-rx="tile-years-unit"> of 100</small></div>
      <div class="rx-tile-note" id="rx-years-note"></div>
    </div>
  </div>

  <p class="rx-verdict" id="rx-verdict">
    <span id="rx-verdict-text"></span>
    <button type="button" id="rx-verdict-load" data-rx="load-plan" hidden>Load that plan</button>
  </p>

  <div class="rx-charts">
    <figure class="rx-card">
      <figcaption>
        <strong data-rx="cap-tradeoff-strong">Every plan is a dot.</strong> <span data-rx="cap-tradeoff">Left is better (less water undelivered), down is better (milder worst month). Click a dot to load that plan.</span>
      </figcaption>
      <div class="rx-legend">
        <span><i class="rx-key rx-key-dot rx-key-current"></i><span data-rx="key-current">your plan</span></span>
        <span><i class="rx-key rx-key-dot rx-key-front"></i><span data-rx="key-front">unbeaten plan</span></span>
        <span><i class="rx-key rx-key-dot rx-key-beaten"></i><span data-rx="key-beaten">beaten plan</span></span>
      </div>
      <svg id="rx-tradeoff" role="img" aria-label="All plans: average shortage against worst month"></svg>
    </figure>
    <div class="rx-column">
      <figure class="rx-card">
        <figcaption><strong data-rx="cap-shortage-strong">The worst month of each of the 100 years</strong> <span data-rx="cap-shortage">(% of that month's need not delivered)</span></figcaption>
        <div class="rx-legend">
          <span><i class="rx-key rx-key-bar rx-key-shortage"></i><span data-rx="key-current">your plan</span></span>
          <span><i class="rx-key rx-key-bar rx-key-reference"></i><span data-rx="key-reference">no rationing</span></span>
        </div>
        <svg id="rx-shortage" role="img" aria-label="Worst month of each year"></svg>
      </figure>
      <figure class="rx-card">
        <figcaption><strong data-rx="cap-storage-strong">Water in the reservoir</strong> <span data-rx="cap-storage">(Mm³),</span> <span id="rx-window"></span></figcaption>
        <div class="rx-legend">
          <span><i class="rx-key rx-key-line rx-key-current"></i><span data-rx="key-current">your plan</span></span>
          <span><i class="rx-key rx-key-line rx-key-reference"></i><span data-rx="key-reference">no rationing</span></span>
          <span><i class="rx-key rx-key-line rx-key-trigger"></i><span data-rx="key-trigger">trigger</span></span>
        </div>
        <svg id="rx-storage" role="img" aria-label="Reservoir storage over time"></svg>
      </figure>
    </div>
  </div>
  <div class="rx-tooltip" id="rx-tooltip" hidden></div>
</div>
